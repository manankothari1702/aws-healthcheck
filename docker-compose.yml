services:
  app:
    build: .
    image: aws-healthcheck:local
    container_name: aws-healthcheck
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      FLASK_PORT: "5000"
      DEFAULT_TARGETS: "https://www.google.com,https://aws.amazon.com"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
